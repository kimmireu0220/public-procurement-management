name: Deploy Learning Site (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Static checks
        run: |
          python -m compileall -q tools tests
          ruff check tools tests
          mypy tools tests
      - name: Test learning tools
        run: python -m unittest discover -s tests -v
      - name: Check generated content and sources
        run: |
          python tools/build_study_cbt.py --check
          python tools/build_cumulative_cbt.py --check
          python tools/build_lecture_pages.py --check
          python tools/private_source_inventory.py
          python tools/verify_legal_sources.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
