name: Deploy CBT (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/cbt-meta.json"
      - "docs/.nojekyll"
      - "docs/1과목/**"
      - "docs/2과목/**"
      - "docs/3과목/**"
      - "docs/study/**"
      - ".github/workflows/deploy-cbt-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test CBT tools
        run: python -m unittest discover -s tests -v
      - name: Validate mock exams
        run: python tools/validate_mock_exam.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
