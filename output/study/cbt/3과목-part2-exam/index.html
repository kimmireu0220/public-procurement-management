<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3과목 Part2 EXAM 학습</title>
<style>
:root {
  --bg: #e8ecf1;
  --panel: #fff;
  --primary: #1a4d8f;
  --primary-dark: #0f3460;
  --accent: #2e7dd1;
  --border: #c5d0de;
  --text: #1a1a1a;
  --muted: #5c6b7a;
  --answered: #2e7dd1;
  --current: #1a4d8f;
  --unanswered: #d0d7e2;
  --warn: #c0392b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

#screen-start { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
.start-card { background: var(--panel); max-width: 520px; width: 100%; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,.12); padding: 2.5rem 2rem; text-align: center; border-top: 4px solid var(--primary); }
.start-card h1 { font-size: 1.65rem; color: var(--primary-dark); margin-bottom: .5rem; }
.start-card .sub { color: var(--muted); font-size: 1.05rem; margin-bottom: 1.5rem; }
.start-card ul { text-align: left; margin: 0 auto 1.75rem; max-width: 340px; font-size: .92rem; line-height: 1.8; color: #333; }
.start-card .btn-start { background: var(--primary); color: #fff; border: none; padding: .85rem 2.5rem; font-size: 1.05rem; border-radius: 4px; cursor: pointer; font-weight: 600; }
.start-card .btn-start:hover { background: var(--primary-dark); }

#screen-exam { display: none; flex-direction: column; height: 100vh; }
.topbar { background: var(--primary-dark); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; font-size: 1.1rem; flex-shrink: 0; min-height: 3.75rem; }
.topbar .exam-title { font-weight: 700; font-size: 1.3rem; }
.topbar .timer { font-size: 1.65rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .05em; }
.topbar .timer.warn { color: #ffcc00; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .7; } }
.subbar { background: var(--primary); color: #fff; padding: .9rem 1.5rem; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; min-height: 3.25rem; }
.subbar #subject-label { font-size: 1.15rem; font-weight: 600; }
.subbar #progress-label { font-size: 1.1rem; font-weight: 600; }

.main { display: flex; flex: 1; overflow: hidden; }
.question-panel { flex: 1; overflow-y: auto; padding: 1.5rem 2rem 2rem; background: var(--panel); }
.q-header { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.25rem; }
.q-badge { background: var(--primary); color: #fff; font-weight: 700; font-size: 1.35rem; min-width: 3.25rem; text-align: center; padding: .45rem .7rem; border-radius: 4px; }
.q-subject { color: var(--muted); font-size: 1rem; font-weight: 600; }
.q-stem { font-size: 1.2rem; line-height: 1.75; margin-bottom: 1.5rem; font-weight: 600; }
.q-stem strong { color: var(--primary-dark); }

.choices { display: flex; flex-direction: column; gap: .65rem; }
.choice { display: flex; align-items: flex-start; gap: .75rem; padding: .85rem 1rem; border: 2px solid var(--border); border-radius: 6px; cursor: pointer; transition: border-color .15s, background .15s; background: #fafbfc; }
.choice:hover { border-color: var(--accent); background: #f0f6fc; }
.choice.selected { border-color: var(--primary); background: #e8f0fa; box-shadow: 0 0 0 1px var(--primary); }
.choice.focused { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice .num { font-weight: 700; color: var(--primary); min-width: 1.75rem; font-size: 1.15rem; }
.choice .text { flex: 1; line-height: 1.6; font-size: 1.12rem; }
.choice input { display: none; }

.nav-panel { width: 280px; background: #f4f6f9; border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.nav-title { padding: .85rem 1rem; font-size: 1rem; font-weight: 700; color: var(--primary-dark); border-bottom: 1px solid var(--border); }
.nav-scroll { overflow-y: auto; flex: 1; padding: .75rem; }
.nav-section { margin-bottom: .9rem; }
.nav-section:last-child { margin-bottom: 0; }
.nav-section-title { font-size: .95rem; font-weight: 700; color: var(--primary-dark); margin-bottom: .45rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); line-height: 1.4; }
.nav-section-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.nav-btn { min-height: 2.35rem; border: 1px solid var(--border); background: var(--unanswered); border-radius: 4px; font-size: .85rem; font-weight: 600; cursor: pointer; color: #444; }
.nav-btn.answered { background: #b8d4f0; border-color: var(--answered); color: var(--primary-dark); }
.nav-btn.current { background: var(--current); color: #fff; border-color: var(--current); }
.nav-btn:hover { filter: brightness(.95); }
.nav-legend { padding: .5rem .75rem; font-size: .72rem; color: var(--muted); border-top: 1px solid var(--border); display: flex; gap: .75rem; flex-wrap: wrap; }
.legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 2px; vertical-align: middle; }

.bottombar { background: var(--panel); border-top: 1px solid var(--border); padding: .65rem 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: .75rem; }
.bottombar-left, .bottombar-right { display: flex; align-items: center; gap: .5rem; }
.bottombar button { padding: .55rem 1.4rem; font-size: .92rem; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: #fff; }
.bottombar button.reset { color: var(--warn); border-color: #e8c4c0; background: #fff8f7; }
.bottombar button.reset:hover { background: #fdecea; }
.bottombar button.primary { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
.bottombar button:disabled { opacity: .4; cursor: not-allowed; }
.progress-text { font-size: 1rem; font-weight: 600; color: var(--text); }

#screen-end { display: none; min-height: 100vh; padding: 2rem; }
.end-card { max-width: 640px; margin: 0 auto; background: var(--panel); border-radius: 8px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,.1); }
.end-card h2 { color: var(--primary-dark); margin-bottom: 1rem; font-size: 1.55rem; }
.end-card textarea { width: 100%; height: 160px; font-family: monospace; font-size: .85rem; padding: .75rem; border: 1px solid var(--border); border-radius: 4px; margin: 1rem 0; }
.end-card .hint { font-size: .88rem; color: var(--muted); line-height: 1.6; }
.end-card button { margin-right: .5rem; margin-top: .5rem; padding: .55rem 1.2rem; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: #fff; }
.end-card button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

@media (max-width: 768px) {
  .main { flex-direction: column; }
  .nav-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 200px; }
  .nav-section-grid { grid-template-columns: repeat(8, 1fr); }
  .question-panel { padding: 1rem; }
}

.topbar .timer { display: none; }
</style>
</head>
<body>

<div id="screen-start">
  <div class="start-card">
    <h1>3과목 Part2 EXAM 학습</h1>
    <p class="sub">공공계약관리 · 문제은행 exam 전체</p>
    <ul>
      <li>총 <strong>92문항</strong> · 제한시간 없음 (학습용)</li>
      <li>4지 선다형 — 문항당 하나만 선택</li>
      <li>답안은 자동 저장됩니다 (브라우저)</li>
    </ul>
    <button class="btn-start" id="btn-start">학습 시작</button>
  </div>
</div>

<div id="screen-exam">
  <div class="topbar">
    <span class="exam-title">3과목 Part2 EXAM 학습</span>
    <span class="timer" id="timer">--:--:--</span>
  </div>
  <div class="subbar">
    <span id="subject-label">1과목 공공조달과 법제도 이해</span>
    <span>
      <span id="progress-label">1 / 92</span>
    </span>
  </div>
  <div class="main">
    <div class="question-panel" id="question-panel"></div>
    <aside class="nav-panel">
      <div class="nav-title">문항 이동</div>
      <div class="nav-scroll" id="nav-scroll"></div>
      <div class="nav-legend">
        <span><span class="legend-dot" style="background:var(--unanswered)"></span>미답</span>
        <span><span class="legend-dot" style="background:#b8d4f0"></span>답변</span>
        <span><span class="legend-dot" style="background:var(--current)"></span>현재</span>
      </div>
    </aside>
  </div>
  <div class="bottombar">
    <div class="bottombar-left">
      <button id="btn-prev">◀ 이전</button>
      <button class="reset" id="btn-reset" type="button">처음부터</button>
    </div>
    <span class="progress-text" id="answered-count">답변 0 / 92</span>
    <div class="bottombar-right">
      <button id="btn-next">다음 ▶</button>
      <button class="primary" id="btn-submit">종료</button>
    </div>
  </div>
</div>

<div id="screen-end">
  <div class="end-card">
    <h2>학습 종료</h2>
    <p class="hint">아래 답안 문자열을 복사해 채팅에 붙여넣으면 채점합니다.<br>형식: <code>1③ 2④ 3④ …</code></p>
    <textarea id="answer-export" readonly></textarea>
    <button class="primary" id="btn-copy">답안 복사</button>
    <button id="btn-restart">다시 풀기</button>
    <p class="hint" style="margin-top:1rem">※ 정답·해설은 채점 후 제공됩니다.</p>
  </div>
</div>

<script>

: "3:2:1:exam:10"}, {"no": 11, "subject": 3, "subjectName": "Part2 Ch1", "stem": "다음 중 국가종합전자조달시스템(나라장터) 입찰참가자격 등록에 대한 설명으로 옳은 것은?", "choices": [{"key": "1", "label": "①", "text": "등록은 선택사항으로, 등록하지 않아도 입찰 참여가 가능하다."}, {"key": "2", "label": "②", "text": "미리 등록한 경우 중앙관서에도 등록한 것으로 본다."}, {"key": "3", "label": "③", "text": "발주기관별로 별도 등록해야 효력이 발생한다."}, {"key": "4", "label": "④", "text": "조달청은 등록증을 발급하지 않는다."}], "id": "3:2:1:exam:11"}, {"no": 12, "subject": 3, "subjectName": "Part2 Ch1", "stem": "다음 중 일반물품의 추정가격 10억원 이상 제조 물품에 대해, 물품납품이행능력에서 만점(45점)을 받은 경우 적용되는 조달청 기준 낙찰하한율로 옳은 것은?", "choices": [{"key": "1", "label": "①", "text": "86.245%"}, {"key": "2", "label": "②", "text": "89.995%"}, {"key": "3", "label": "③", "text": "82.495%"}, {"key": "4", "label": "④", "text": "95.500%"}], "id": "3:2:1:exam:12"}, {"no": 13, "subject": 3, "subjectName": "Part2 Ch1", "stem": "다음 중 물품이나 용역의 적격심사 항목과 배점한도액을 정함에 있어 옳은 설명은?", "choices": [{"key": "1", "label": "①", "text": "재정경제부장관이 고시한 적격심사기준에 따라 공사의 기준을 준용해 정한다."}, {"key": "2", "label": "②", "text": "공사의 적격심사 기준과 무관하게 발주기관이 자율적으로 정한다."}, {"key": "3", "label": "③", "text": "반드시 조달청장이 단독으로 심사기준을 정해야 한다."}, {"key": "4", "label": "④", "text": "지방자치단체의 계약집행기준만을 적용한다."}], "id": "3:2:1:exam:13"}, {"no": 14, "subject": 3, "subjectName": "Part2 Ch1", "stem": "다음 중 적격심사 자료 제출 및 보완에 관한 설명으로 옳은 것은?", "choices": [{"key": "1", "label": "①", "text": "적격심사 대상자는 통보를 받은 날로부터 반드시 3일 이내에 서류를 제출해야 한다."}, {"key": "2", "label": "②", "text": "제출서류가 일부 누락된 경우에는 즉시 낙찰 대상에서 제외한다."}, {"key": "3", "label": "③", "text": "보완 요구기한까지 서류가 제출되지 않으면, 당초 제출된 서류만으로 심사할 수 있다."}, {"key": "4", "label": "④", "text": "종합평점이 통과점수에 미달하더라도 적격심사 서류 제출은 반드시 요구해야 한다."}], "id": "3:2:1:exam:14"}, {"no": 15, "subject": 3, "subjectName": "Part2 Ch1", "stem": "다음 중 발주기관의 적격심사기준 설정 권한에 대한 설명으로 가장 옳은 것은?", "choices": [{"key": "1", "label": "①", "text": "발주기관은 모든 계약에서 자유롭게 적격심사기준을 정할 수 있다."}, {"key": "2", "label": "②", "text": "물품·용역의 적격심사 항목과 배점한도는 발주기관이 임의로 변경할 수 있다."}, {"key": "3", "label": "③", "text": "물품이나 용역의 특성상 필요하다고 인정되는 경우 재정경제부장관과 협의를 거쳐 직접 심사기준을 정할 수 있다."}, {"key": "4", "label": "④", "text": "시설공사는 어떠한 경우에도 적격심사기준을 변경할 수 없다."}], "id": "3:2:1:exam:15"}, {"no": 16, "subject": 3, "subjectName": "Part2 Ch1", "stem": "다음 중 외국인근로자의 근로조건 이행과 관련하여 전자조달시스템 등록 업체에 대한 조치로 옳은 것은?", "choices": [{"key": "1", "label": "①", "text": "등록된 업체는 즉시 입찰참가자격이 박탈된다."}, {"key": "2", "label": "②", "text": "미이행 횟수와 관계없이 감점은 1회만 적용된다."}, {"key": "3", "label": "③", "text": "등록일로부터 6개월간 적격심사에서 감점을 받는다."}, {"key": "4", "label": "④", "text": "등록일로부터 1년간 적격심사 신인도 평가에서 감점을 받을 수 있다."}], "id": "3:2:1:exam:16"}, {"no": 17, "subject": 3, "subjectName": "Part2 Ch1", "stem": "다음 중 적격심사 낙찰자 결정 절차에 대한 설명으로 가장 옳은 것은?", "choices": [{"key": "1", "label": "①", "text": "종합평점이 85점 미만이더라도 최저가이면 낙찰자로 결정된다."}, {"key": "2", "label": "②", "text": "동일가격 최저가 입찰자가 2인 이상인 경우에는 무조건 추첨으로 낙찰자를 정한다."}, {"key": "3", "label": "③", "text": "최저가 입찰자가 심사서류 제출 후 낙찰자 결정 전에 심사를 포기한 경우에도 차순위자 심사는 불가능하다."}, {"key": "4", "label": "④", "text": "예정가격 이내 입찰자를 대상으로 필요 시 동시에 적격심사를 실시할 수 있다."}], "id": "3:2:1:exam:17"}, {"no": 18, "subject": 3, "subjectName": "Part2 Ch1", "stem": "다음 중 경영상태 평가(부채비율·유동비율)에 대한 설명으로 옳은 것은?", "choices": [{"key": "1", "label": "①", "text": "종합건설사업자와 전문건설사업자는 동일한 가중평균비율을 적용한다."}, {"key": "2", "label": "②", "text": "종합건설사업자는 전문건설사업자 가중평균비율을 기준으로 평가한다."}, {"key": "3", "label": "③", "text": "전문건설사업자가 전문공사에 참여하는 경우 해당 전문공사 업종의 가중평균비율을 기준으로 평가한다."}, {"key": "4", "label": "④", "text": "경영상태 평가는 공사계약 특칙에서 제외된다."}], "id": "3:2:1:exam:18"}, {"no": 19, "subject": 3, "subjectName": "Part2 Ch1", "stem": "다음 중 낙찰자 결격사유의 발생 시점과 효과에 대한 설명으로 옳은 것은?", "choices": [{"key": "1", "label": "①", "text": "입찰서 제출마감일 이후 결격사유가 발생하면 무조건 부적격이다."}, {"key": "2", "label": "②", "text": "낙찰자 결정 이후 결격사유가 발생한 경우에도 낙찰자 결정은 무효가 된다."}, {"key": "3", "label": "③", "text": "입찰서 제출마감일 이후 결격사유가 발생했더라도 낙찰자 결정 전에 해소되면 부적격자로 볼 수 없다."}, {"key": "4", "label": "④", "text": "결격사유가 발생하면 해소 여부와 관계없이 항상 낙찰자에서 제외된다."}], "id": "3:2:1:exam:19"}, <script>
/* CBT 응시 — 시험 상태·답안·타이머 (비즈니스 로직) */
(function (global) {
  const CHOICE_SYM = { 1: '①', 2: '②', 3: '③', 4: '④' };
  const DURATION_SEC = 120 * 60;

  function subjectLabel(q) {
    return q.subject + '과목 ' + q.subjectName;
  }

  function formatTime(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return [h, m, s].map(v => String(v).padStart(2, '0')).join(':').replace(/^00:/, '');
  }

  function createSession(questions, storageKey, durationSec) {
    const duration = durationSec || DURATION_SEC;
    const deadlineStorageKey = storageKey + '_deadline';
    let current = 0;
    let answers = {};
    let timerSec = duration;
    let timerId = null;
    let choiceFocus = 0;
    let examActive = false;
    let deadlineMs = null;

    function loadAnswers() {
      try {
        const s = localStorage.getItem(storageKey);
        if (s) answers = JSON.parse(s);
      } catch (e) {}
    }

    function saveAnswers() {
      localStorage.setItem(storageKey, JSON.stringify(answers));
    }

    function clearStoredAnswers() {
      localStorage.removeItem(storageKey);
    }

    function clearStoredSession() {
      localStorage.removeItem(storageKey);
      localStorage.removeItem(deadlineStorageKey);
    }

    function loadOrCreateDeadline() {
      try {
        const stored = Number(localStorage.getItem(deadlineStorageKey));
        if (Number.isFinite(stored) && stored > 0) {
          deadlineMs = stored;
        } else {
          deadlineMs = Date.now() + duration * 1000;
          localStorage.setItem(deadlineStorageKey, String(deadlineMs));
        }
      } catch (e) {
        deadlineMs = Date.now() + duration * 1000;
      }
      timerSec = Math.max(0, Math.ceil((deadlineMs - Date.now()) / 1000));
    }

    function getQuestions() {
      return questions;
    }

    function getCurrentIndex() {
      return current;
    }

    function getCurrentQuestion() {
      return questions[current];
    }

    function getChoiceFocus() {
      return choiceFocus;
    }

    function setChoiceFocus(idx) {
      choiceFocus = idx;
    }

    function moveChoiceFocus(delta) {
      const n = getCurrentQuestion().choices.length;
      choiceFocus = (choiceFocus + delta + n) % n;
    }

    function syncChoiceFocusFromAnswer() {
      const q = getCurrentQuestion();
      const selected = answers[q.no];
      const selIdx = selected ? q.choices.findIndex(c => c.key === selected) : -1;
      choiceFocus = selIdx >= 0 ? selIdx : 0;
    }

    function getAnswer(no) {
      return answers[no];
    }

    function getAnsweredCount() {
      return Object.keys(answers).length;
    }

    function getUnansweredCount() {
      return questions.length - getAnsweredCount();
    }

    function canGoPrev() {
      return current > 0;
    }

    function canGoNext() {
      return current < questions.length - 1;
    }

    function goPrev() {
      if (!canGoPrev()) return false;
      current--;
      return true;
    }

    function goNext() {
      if (!canGoNext()) return false;
      current++;
      return true;
    }

    function goToIndex(index) {
      if (index < 0 || index >= questions.length) return false;
      current = index;
      return true;
    }

    function selectAnswer(key) {
      const q = getCurrentQuestion();
      answers[q.no] = key;
      saveAnswers();
      const idx = q.choices.findIndex(c => c.key === key);
      if (idx >= 0) choiceFocus = idx;

      const advanced = current < questions.length - 1;
      if (advanced) current++;
      return { advanced };
    }

    function selectAnswerByIndex(choiceIndex) {
      const q = getCurrentQuestion();
      if (choiceIndex < 0 || choiceIndex >= q.choices.length) return null;
      return selectAnswer(q.choices[choiceIndex].key);
    }

    function exportAnswers() {
      return questions.map(q => {
        const a = answers[q.no];
        const sym = CHOICE_SYM[a] || '?';
        return q.no + sym;
      }).join(' ');
    }

    function resetSession() {
      answers = {};
      clearStoredAnswers();
      current = 0;
      choiceFocus = 0;
    }

    function resetConfirmMessage() {
      const n = getAnsweredCount();
      return n > 0
        ? '선택한 답안 ' + n + '개를 모두 지우고 1번 문항부터 다시 시작합니다.'
        : '1번 문항부터 다시 시작합니다.';
    }

    function finishConfirmMessage() {
      const left = getUnansweredCount();
      return '미답 ' + left + '문항이 있습니다. 시험을 종료하시겠습니까?';
    }

    function startExam() {
      loadOrCreateDeadline();
      examActive = true;
    }

    function stopExam() {
      examActive = false;
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function isExamActive() {
      return examActive;
    }

    function getTimerSec() {
      return timerSec;
    }

    function startTimer(onTick) {
      if (timerSec <= 0) {
        stopExam();
        onTick(0, true);
        return;
      }
      timerId = setInterval(() => {
        timerSec = Math.max(0, Math.ceil((deadlineMs - Date.now()) / 1000));
        onTick(timerSec);
        if (timerSec <= 0) {
          stopExam();
          onTick(0, true);
        }
      }, 1000);
    }

    return {
      CHOICE_SYM,
      DURATION_SEC: duration,
      subjectLabel,
      formatTime,
      loadAnswers,
      saveAnswers,
      clearStoredAnswers,
      clearStoredSession,
      getQuestions,
      getCurrentIndex,
      getCurrentQuestion,
      getChoiceFocus,
      setChoiceFocus,
      moveChoiceFocus,
      syncChoiceFocusFromAnswer,
      getAnswer,
      getAnsweredCount,
      getUnansweredCount,
      canGoPrev,
      canGoNext,
      goPrev,
      goNext,
      goToIndex,
      selectAnswer,
      selectAnswerByIndex,
      exportAnswers,
      resetSession,
      resetConfirmMessage,
      finishConfirmMessage,
      startExam,
      stopExam,
      isExamActive,
      getTimerSec,
      startTimer,
    };
  }

  global.CBTExam = { createSession, DURATION_SEC, formatTime };
})(window);

</script>
<script>
/* CBT 응시 — DOM 렌더링·이벤트 (UI 로직) */
(function (global) {
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatStem(s) {
    return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function init(session) {
    const screenStart = document.getElementById('screen-start');
    const screenExam = document.getElementById('screen-exam');
    const screenEnd = document.getElementById('screen-end');
    const questionPanel = document.getElementById('question-panel');
    const navScroll = document.getElementById('nav-scroll');
    const timerEl = document.getElementById('timer');
    const subjectLabelEl = document.getElementById('subject-label');
    const progressLabelEl = document.getElementById('progress-label');
    const answeredCountEl = document.getElementById('answered-count');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const answerExportEl = document.getElementById('answer-export');

    function updateChoiceFocus() {
      if (!questionPanel) return;
      questionPanel.querySelectorAll('.choice').forEach((el, i) => {
        el.classList.toggle('focused', i === session.getChoiceFocus());
      });
      const focused = questionPanel.querySelector('.choice.focused');
      if (focused) focused.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function updateNav() {
      const questions = session.getQuestions();
      const current = session.getCurrentIndex();
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const i = parseInt(btn.dataset.index, 10);
        const q = questions[i];
        btn.classList.remove('current', 'answered');
        if (i === current) {
          btn.classList.add('current');
          btn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else if (session.getAnswer(q.no)) {
          btn.classList.add('answered');
        }
      });
    }

    function updateCount() {
      const total = session.getQuestions().length;
      answeredCountEl.textContent = '답변 ' + session.getAnsweredCount() + ' / ' + total;
    }

    function renderNavGrid() {
      const questions = session.getQuestions();
      navScroll.innerHTML = '';
      let lastSubject = null;
      let sectionGrid = null;

      questions.forEach((q, i) => {
        if (q.subject !== lastSubject) {
          lastSubject = q.subject;
          const section = document.createElement('div');
          section.className = 'nav-section';
          const title = document.createElement('div');
          title.className = 'nav-section-title';
          title.textContent = q.subject + '과목 ' + q.subjectName;
          sectionGrid = document.createElement('div');
          sectionGrid.className = 'nav-section-grid';
          section.appendChild(title);
          section.appendChild(sectionGrid);
          navScroll.appendChild(section);
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nav-btn';
        btn.dataset.index = String(i);
        btn.textContent = q.no;
        btn.title = session.subjectLabel(q);
        btn.addEventListener('click', () => {
          session.goToIndex(i);
          renderQuestion();
        });
        sectionGrid.appendChild(btn);
      });
    }

    function renderQuestion() {
      const q = session.getCurrentQuestion();
      const selected = session.getAnswer(q.no);
      session.syncChoiceFocusFromAnswer();

      let html = '<div class="q-header"><span class="q-badge">' + escapeHtml(q.no) + '</span><span class="q-subject">' + escapeHtml(session.subjectLabel(q)) + '</span></div>';
      html += '<div class="q-stem">' + formatStem(q.stem) + '</div>';
      html += '<div class="choices" id="choices">';
      q.choices.forEach((c, i) => {
        const sel = selected === c.key ? ' selected' : '';
        const foc = i === session.getChoiceFocus() ? ' focused' : '';
        html += '<label class="choice' + sel + foc + '" data-key="' + escapeHtml(c.key) + '" data-idx="' + i + '"><span class="num">' + escapeHtml(c.label) + '</span><span class="text">' + escapeHtml(c.text) + '</span><input type="radio" name="q" value="' + escapeHtml(c.key) + '"' + (sel ? ' checked' : '') + '></label>';
      });
      html += '</div>';
      questionPanel.innerHTML = html;

      questionPanel.querySelectorAll('.choice').forEach(el => {
        el.addEventListener('click', () => {
          session.selectAnswer(el.dataset.key);
          renderQuestion();
        });
      });

      subjectLabelEl.textContent = session.subjectLabel(q);
      progressLabelEl.textContent = (session.getCurrentIndex() + 1) + ' / ' + session.getQuestions().length;
      btnPrev.disabled = !session.canGoPrev();
      btnNext.disabled = !session.canGoNext();
      updateNav();
      updateCount();
      updateChoiceFocus();
    }

    function startTimer() {
      timerEl.textContent = session.formatTime(session.getTimerSec());
      session.startTimer((sec, timedOut) => {
        timerEl.textContent = session.formatTime(sec);
        if (sec <= 600) timerEl.classList.add('warn');
        if (timedOut) finishExam(true);
      });
    }

    function finishExam(auto) {
      if (!auto) {
        const left = session.getUnansweredCount();
        if (left > 0 && !confirm(session.finishConfirmMessage())) return;
      }
      session.stopExam();
      screenExam.style.display = 'none';
      screenEnd.style.display = 'block';
      answerExportEl.value = session.exportAnswers();
    }

    function handleExamKeydown(e) {
      if (!session.isExamActive()) return;
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

      const q = session.getCurrentQuestion();
      const n = q.choices.length;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        session.moveChoiceFocus(1);
        updateChoiceFocus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        session.moveChoiceFocus(-1);
        updateChoiceFocus();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (session.goPrev()) renderQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (session.goNext()) renderQuestion();
      } else if (e.key >= '1' && e.key <= '4') {
        const idx = parseInt(e.key, 10) - 1;
        if (idx < n) {
          e.preventDefault();
          session.selectAnswerByIndex(idx);
          renderQuestion();
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (session.goNext()) renderQuestion();
      }
    }

    document.getElementById('btn-start').addEventListener('click', () => {
      session.loadAnswers();
      screenStart.style.display = 'none';
      screenExam.style.display = 'flex';
      session.startExam();
      renderNavGrid();
      renderQuestion();
      startTimer();
    });

    document.addEventListener('keydown', handleExamKeydown);

    btnPrev.addEventListener('click', () => {
      if (session.goPrev()) renderQuestion();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (!confirm(session.resetConfirmMessage())) return;
      session.resetSession();
      renderNavGrid();
      renderQuestion();
    });

    btnNext.addEventListener('click', () => {
      if (session.goNext()) renderQuestion();
    });

    document.getElementById('btn-submit').addEventListener('click', () => finishExam(false));

    document.getElementById('btn-copy').addEventListener('click', () => {
      answerExportEl.select();
      navigator.clipboard.writeText(answerExportEl.value).catch(() => {});
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      if (confirm('저장된 답안을 지우고 처음부터 다시 시작합니다.')) {
        session.clearStoredSession();
        location.reload();
      }
    });
  }

  global.CBTUI = { init };
})(window);

</script>
<script>
CBTUI.init(CBTExam.createSession(QUESTIONS, STORAGE_KEY, EXAM_DURATION_SEC));
</script>
</body>
</html>
